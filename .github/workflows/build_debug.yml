name: Android Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Кешируем Gradle
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Даём права на выполнение gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Собираем debug APK
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 6. Загружаем APK как артефакт
      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RussianPath-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # 7. Показываем информацию о сборке
      - name: Show Debug APK info
        run: |
          echo "✅ Debug build successful!"
          echo "📦 APK size: $(ls -lh app/build/outputs/apk/debug/app-debug.apk | awk '{print $5}')"
          echo "📁 Path: app/build/outputs/apk/debug/app-debug.apk"

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Кешируем Gradle
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Даём права на выполнение gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Проверяем наличие keystore
      - name: Check keystore exists
        run: |
          if [ -f "app/my-release-key.jks" ]; then
            echo "✅ Keystore found at app/my-release-key.jks"
            ls -la app/my-release-key.jks
          else
            echo "❌ Keystore NOT found at app/my-release-key.jks"
            exit 1
          fi

      # 6. Собираем release APK
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # 7. Загружаем APK как артефакт
      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RussianPath-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      # 8. Загружаем AAB как артефакт (для Google Play)
      - name: Upload Release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: RussianPath-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

      # 9. Показываем информацию о сборке
      - name: Show Release APK info
        run: |
          echo "✅ Release build successful!"
          echo "📦 APK size: $(ls -lh app/build/outputs/apk/release/app-release.apk | awk '{print $5}')"
          echo "📁 Path: app/build/outputs/apk/release/app-release.apk"
