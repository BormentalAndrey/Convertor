name: Build Debug APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Кешируем Gradle
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Даём права на выполнение gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Собираем debug APK
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 6. Загружаем APK как артефакт
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RussianPath-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # 7. Показываем информацию о сборке
      - name: Show APK info
        run: |
          echo "✅ Build successful!"
          echo "📦 APK size: $(ls -lh app/build/outputs/apk/debug/app-debug.apk | awk '{print $5}')"
          echo "📁 Path: app/build/outputs/apk/debug/app-debug.apk"
